spring:
  application:
    name: bff

server:
  port: 8080

# URLs de los microservicios internos (sobreescritas por docker-compose o EC2)
services:
  solicitudes:
    url: ${SOLICITUDES_URL:http://localhost:8081}
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8082}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesatech}
    username: ${DB_USER:mesatech}
    password: ${DB_PASSWORD:mesatech_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences: ${ENTRA_AUDIENCE}

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.mesatech: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev
